<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#0a0f24" />
      <stop offset="80%" stop-color="#0c122b" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pinkGlow" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#70A5FF" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#00F0FF" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="320" rx="16" fill="url(#cyanGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#purpleGlow)" />
  <rect width="1200" height="320" rx="16" fill="url(#pinkGlow)" />

  <!-- High-Tech Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="15" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Futuristic Wave Graphic at Bottom -->
  <path d="M 0 260 C 250 210, 420 290, 680 240 C 920 195, 1070 270, 1200 235 L 1200 320 L 0 320 Z" fill="url(#waveGrad)" opacity="0.15" />
  <path d="M 0 275 Q 320 220, 620 270 T 1200 250" fill="none" stroke="url(#titleGrad)" stroke-width="2" opacity="0.6" />
  <path d="M 0 290 Q 400 255, 780 295 T 1200 275" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.35" />

  <!-- Decorative Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1180 40 L 1180 20 L 1160 20" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 20 280 L 20 300 L 40 300" stroke="#6366F1" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1180 280 L 1180 300 L 1160 300" stroke="#00F0FF" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Top Status Pill / Terminal Header -->
  <g transform="translate(60, 40)">
    <rect width="360" height="30" rx="15" fill="url(#badgeBg)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="15" r="4.5" fill="#22C55E" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="1.5">
      SYSTEM STATUS: <tspan fill="#4ADE80">ONLINE</tspan> | ARCHITECT
    </text>
  </g>

  <!-- Right Side Terminal Badge -->
  <g transform="translate(930, 40)">
    <rect width="210" height="30" rx="8" fill="url(#badgeBg)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
    <text x="105" y="20" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="500" fill="#A5B4FC">
      &lt;/&gt; vabhijit516-bot
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)" filter="url(#subtleGlow)">
      ABHIJIT
    </text>
    <!-- Lightning Bolt Accent -->
    <path d="M 285 -48 L 265 -15 L 280 -15 L 260 20 L 305 -25 L 285 -25 Z" fill="#FACC15" filter="url(#subtleGlow)">
      <animate attributeName="transform" type="scale" values="1; 1.05; 1" dur="1.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Hero Subtitle & Descriptor -->
  <g transform="translate(60, 182)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="url(#subGrad)" letter-spacing="0.3">
      Full-Stack Software Engineer <tspan fill="#38BDF8">•</tspan> Distributed Systems <tspan fill="#A855F7">•</tspan> AI &amp; Cloud Architect
    </text>
  </g>

  <!-- Tech Stack Chips / Interactive Badges -->
  <g transform="translate(60, 215)">
    <!-- Pill 1: React / Next -->
    <g transform="translate(0, 0)">
      <rect width="138" height="32" rx="16" fill="url(#badgeBg)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
      <text x="69" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#38BDF8">⚛️ React • Next.js</text>
    </g>

    <!-- Pill 2: TypeScript / Node -->
    <g transform="translate(148, 0)">
      <rect width="142" height="32" rx="16" fill="url(#badgeBg)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5" />
      <text x="71" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#818CF8">📘 TypeScript • Node</text>
    </g>

    <!-- Pill 3: Python / FastAPI -->
    <g transform="translate(300, 0)">
      <rect width="145" height="32" rx="16" fill="url(#badgeBg)" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5" />
      <text x="72.5" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#C084FC">🐍 Python • FastAPI</text>
    </g>

    <!-- Pill 4: Cloud & Docker -->
    <g transform="translate(455, 0)">
      <rect width="140" height="32" rx="16" fill="url(#badgeBg)" stroke="#EC4899" stroke-width="1" stroke-opacity="0.5" />
      <text x="70" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#F472B6">🐳 Docker • Cloud</text>
    </g>

    <!-- Pill 5: AI & Agents -->
    <g transform="translate(605, 0)">
      <rect width="140" height="32" rx="16" fill="url(#badgeBg)" stroke="#22C55E" stroke-width="1" stroke-opacity="0.5" />
      <text x="70" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#4ADE80">🤖 AI Systems</text>
    </g>
  </g>

  <!-- Right Floating Tech Graphic Matrix -->
  <g transform="translate(930, 110)">
    <!-- Circuit frame box -->
    <rect width="210" height="135" rx="12" fill="#090E1D" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    
    <!-- Window buttons -->
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="48" cy="18" r="4.5" fill="#10B981" opacity="0.8" />

    <!-- Code lines simulation -->
    <text x="20" y="48" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#64748B">const engineer = {</text>
    <text x="32" y="66" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#38BDF8">  name: <tspan fill="#FDE047">'Abhijit'</tspan>,</text>
    <text x="32" y="84" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#818CF8">  passion: <tspan fill="#4ADE80">'High-Scale'</tspan>,</text>
    <text x="32" y="102" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#F472B6">  status: <tspan fill="#00F0FF">'ReadyToBuild'</tspan></text>
    <text x="20" y="120" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#64748B">};</text>
  </g>
</svg>
